version: '3.8'

services:
  mongodb:
    image: mongo:8.0
    container_name: hyderabad-realestate-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - realty_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hyderabad-realestate-backend
    restart: always
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/venture
      - SERVER_PORT=8085
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
    depends_on:
      - mongodb
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - realty_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hyderabad-realestate-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - realty_network

volumes:
  mongo_data:
  backend_uploads:

networks:
  realty_network:
    driver: bridge
